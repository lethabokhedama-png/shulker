name: Build Shulker APK

on:
   push:
      branches: [main]
   workflow_dispatch:

concurrency:
   group: apk-build
   cancel-in-progress: true

jobs:
   build:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repo
           uses: actions/checkout@v4

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm
              cache-dependency-path: web/package-lock.json

         - name: Install web dependencies
           working-directory: web
           run: npm ci

         - name: Build Vite app
           working-directory: web
           env:
              # Fix: original had "${{ secrets.VITE_API_URL }} }}" — extra "  }}"
              # caused GitHub Actions to silently ignore the entire env block.
              VITE_API_URL: ${{ secrets.VITE_API_URL }}
              # NODE_ENV=production ensures import.meta.env.PROD === true inside
              # the Vite bundle. Without this, assembleDebug leaves NODE_ENV unset,
              # so PROD is false and API_BASE resolves to '/api' — a relative path
              # that file:// WebViews can't resolve, causing HTML-instead-of-JSON.
              NODE_ENV: production
           run: npm run build

         - name: Sync Capacitor
           working-directory: web
           run: npx cap sync android

         - name: Set up Java 21
           uses: actions/setup-java@v4
           with:
              java-version: "21"
              distribution: "temurin"

         - name: Set up Android SDK
           uses: android-actions/setup-android@v3

         - name: Install SDK platform and build tools
           run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

         - name: Make gradlew executable
           working-directory: web/android
           run: chmod +x gradlew

         # Debug build — no keystore needed, APK is immediately installable
         # via adb or direct file transfer. The JS bundle is production-optimised
         # (NODE_ENV=production above) even though the APK variant is debug.
         - name: Build debug APK
           working-directory: web/android
           run: ./gradlew assembleDebug

         - name: Upload APK artifact
           uses: actions/upload-artifact@v4
           with:
              name: shulker-debug
              path: web/android/app/build/outputs/apk/debug/app-debug.apk
              retention-days: 30
